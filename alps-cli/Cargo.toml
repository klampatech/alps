[package]
name = "alps"
version = "0.1.0"
edition = "2021"
description = "ALPS — Agentic Loop Programming System (CLI)"
license = "MIT"

[[bin]]
name = "alps"
path = "src/main.rs"

[dependencies]
alps-core = { path = "../alps-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
